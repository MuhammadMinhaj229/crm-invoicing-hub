name: Architecture checks

on:
  push:
    branches:
      - "architecture/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: architecture-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install
      - name: Check lockfile is in sync
        run: git diff --exit-code -- bun.lock
      - name: Lint
        run: bun run lint
      - name: Type check
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
