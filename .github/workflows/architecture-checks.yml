name: Architecture checks

on:
  push:
    branches:
      - "architecture/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: architecture-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install
      - name: Report lockfile drift
        run: |
          if ! git diff --quiet -- bun.lock; then
            echo "::warning::bun.lock is refreshed by this Bun version. Commit a regenerated lockfile before using frozen installs."
            git diff --stat -- bun.lock
          fi
      - name: Lint
        run: bun run lint
      - name: Page document schema tests
        run: bun test tests/page-document-schema.test.ts
      - name: Type check
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
