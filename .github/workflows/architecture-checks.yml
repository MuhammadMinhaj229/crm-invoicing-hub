name: Architecture checks

on:
  push:
    branches:
      - main
      - "architecture/**"
      - "hardening/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: architecture-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install
      - name: Report lockfile drift
        run: |
          if ! git diff --quiet -- bun.lock; then
            echo "::warning::This Bun version refreshes bun.lock. Review and commit the normalized lockfile before enforcing frozen installs."
            git diff --stat -- bun.lock
          fi
      - name: Lint architecture and security modules
        run: bun run lint:architecture
      - name: Unit and security tests
        run: bun test tests/page-document-schema.test.ts tests/cms-seed.test.ts tests/published-state.test.ts tests/access-control.test.ts tests/webhook-auth.test.ts
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: SQL publication migration integration test
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/publish-page-document.setup.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261010000000_cms_foundation.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261011000000_atomic_page_publish.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261012000000_lock_down_cms_access.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261012100000_seed_bootstrap_and_handshake.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/cms-seed-bootstrap.test.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/publish-page-document.test.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/legacy-schema-reset.setup.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261014090000_reset_legacy_public_schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/legacy-schema-reset.test.sql
      - name: Type check
        run: bunx tsc --noEmit
      - name: Studio production build
        run: bun run build
      - name: Public website production build
        run: bun run build:public
